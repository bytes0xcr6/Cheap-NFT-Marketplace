[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 1000000
bytecode_hash = "none"
cbor_metadata = false

# Gas reporting settings
gas_reports = ["NFTMarketplace", "TestNFT", "TestToken"]
gas_reports_ignore = []

[profile.default.fuzz]
runs = 256

[profile.default.coverage]
via_ir = true

[rpc_endpoints]
arbitrum-sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", url = "${ARBISCAN_SEPOLIA_URL}" }

[fmt]
number_underscore = "thousands"
